(function () {

  const MONETAG_URL = 'https://uplcm.com/4/11969106';
  const FB_APP_ID   = '291494419107518';

  const ROASTS = {
    low: [
      "{myName}, {percent}% मात्र चान्स छ! उसले तँलाई सम्झेर होइन, फेसबुक मेमोरीले सम्झाएको हो।",

      "{myName}, ब्लक गरेको छैन भनेर खुसी नमान। {percent}% को हिसाबले उसले नम्बरै बिर्सेको छ।"
    ],
    medium: [
      "{myName}, {percent}% चान्स छ। ऊ फर्किन सक्छ, तर तेरो पुरानो च्याट पढेर मात्र।",
      "५०-५० को खेल हो {myName} ({percent}%)! ऊ म्यासेज गर्न सक्छ, तर पहिले मोमो खुवाउनुपर्ला।",
      "ऊ अलिअलि नरम छ {myName} — {percent}% सिग्नल आइरहेको छ, तर हेयरस्टाइल हेरेपछि मात्र सोच्छ।",
      "{percent}% आशा राख {myName}, तर त्यो आशालाई चिया खुवाएर राख, बेफालतू पोल्न नदे।",
      "उसको मनमा तँप्रति केही छ {myName} ({percent}%), तर त्यो भन्दा बढी उसको नयाँ फोनको लोभ छ।"
    ],
    high: [
      "{myName}, {percent}% तगडा चान्स! ऊ फर्किन्छ — पुरानो जुत्ता जस्तै, लगाउन मन लाग्छ, गन्ध मात्र सहनुपर्छ।",
      "{percent}% चान्स छ {myName}! ऊ फर्किन्छ, तर पहिले उसको नयाँ साथीलाई 'भाइ' भन्न सिक्नुपर्छ।",
      "{percent}% सम्भावना छ {myName}! ऊ आउँछ, तर तेरो कोठाको फोहोर देखेर फेरि भाग्न सक्छ।",
      "{myName}, {percent}% छ! ऊ फर्किने तयारीमा छ — 'तिम्रो अर्को के भयो?' को जवाफ तयार राख।",
      "{percent}% नजिक छ {myName}! ऊ आउँछ, तर वालेट र बैंक ब्यालेन्स देखेर प्रेम अलि घट्न सक्छ।"
    ]
  };

  const MOOD_NOTES = {
    miss: "💭 मिस गरिरहेको छस् भने पहिले आफ्नै मन सम्हाल, अनि मात्र म्यासेज टाइप गर।",
    ego:  "🔥 रिस र माया दुवै छ भने चिसो पानी खा, अनि मात्र 'Seen' मा हात हाल।",
    fun:  "😎 जस्ट फर फन भन्दै छस्, तर यो रिजल्ट हेर्न त आइहाल्यो नि, हैन?"
  };

  const TIME_NOTES = {
    recent: "⏳ ब्रेकअप भर्खरै भएकाले घाउ ताजै छ, हतार नगर।",
    year:   "📅 एक वर्ष बित्यो, अब ऊ पनि सोचिरहेको हुन सक्छ।",
    long:   "🕰️ धेरै समय भइसक्यो, पुरानो कुरा पुरानै रहन्छ कि नयाँ सुरुवात हुन्छ, कसले भन्न सक्छ?"
  };

  const CATEGORY_META = {
    low:    { label: '🚫 जीरो होप जोन (0% – 30%)',         color: '#38bdf8' },
    medium: { label: '⚖️ ५०-५० मिक्स्ड सिग्नल (31% – 70%)',    color: '#fbbf24' },
    high:   { label: '🔥 तगडा चान्स जोन (71% – 100%)',        color: '#f472b6' }
  };

  function hashString(str, seed) {
    let h = seed | 0;
    for (let i = 0; i < str.length; i++) {
      h = ((h << 5) - h + str.charCodeAt(i)) | 0;
    }
    return Math.abs(h);
  }

  function getCategory(percent) {
    if (percent <= 30) return 'low';
    if (percent <= 70) return 'medium';
    return 'high';
  }

  function fillTemplate(template, vars) {
    return template.replace(/\{(\w+)\}/g, function (match, key) {
      return Object.prototype.hasOwnProperty.call(vars, key) ? String(vars[key]) : '';
    });
  }

  function capitalize(str) {
    if (!str) return '';
    return str.charAt(0).toUpperCase() + str.slice(1);
  }

  function safeOpen(url) {
    try {
      const w = window.open(url, '_blank', 'noopener');
      return w !== null && typeof w !== 'undefined';
    } catch (e) { return false; }
  }

  function validateName(raw, isEx) {
    const name = String(raw || '').replace(/\s+/g, ' ').trim();
    if (!name) {
      return { ok: false, msg: isEx ? 'कृपया एक्सको नाम लेख्नुहोस्! 🚫' : 'कृपया आफ्नो नाम लेख्नुहोस्! 🚫' };
    }
    if (name.length < 2) {
      return { ok: false, msg: 'नाम कम्तीमा २ अक्षरको हुनुपर्छ! ✍️' };
    }
    return { ok: true, name: name };
  }

  let toastTimer = null;
  function showToast(message, duration) {
    const toast = document.getElementById('toast');
    if (!toast) return;
    toast.textContent = message;
    toast.style.opacity = '1';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toast.style.opacity = '0';
    }, duration || 2400);
  }

  const lastResult = { percent: 0, name: '', category: 'low' };
  let isCalculating = false;
  let isRendering   = false;

  const $ = function (id) { return document.getElementById(id); };

  const els = {
    formBox:      $('form-box'),
    resultBox:    $('result-box'),
    myName:       $('myName'),
    exName:       $('exName'),
    breakupTime:  $('breakupTime'),
    mood:         $('userMood'),
    calcBtn:      $('calcBtn'),
    resultTitle:  $('result-title'),
    percentage:   $('percentage'),
    chanceLabel:  $('chance-label'),
    prediction:   $('prediction-text'),
    extra:        $('extra-text'),
    captureCard:  $('capture-card'),
    downloadBtn:  $('downloadBtn'),
    shareFb:      $('shareFb'),
    shareMsgr:    $('shareMsgr'),
    shareWa:      $('shareWa'),
    shareIg:      $('shareIg'),
    resetBtn:     $('resetBtn')
  };

  function calculateChance() {
    if (isCalculating) return;

    const myCheck = validateName(els.myName.value, false);
    if (!myCheck.ok) { alert(myCheck.msg); els.myName.focus(); return; }

    const exCheck = validateName(els.exName.value, true);
    if (!exCheck.ok) { alert(exCheck.msg); els.exName.focus(); return; }

    const myNameRaw = myCheck.name;
    const exNameRaw = exCheck.name;
    const myName = capitalize(myNameRaw);

    const mood = Object.prototype.hasOwnProperty.call(MOOD_NOTES, els.mood.value) ? els.mood.value : 'fun';
    const breakupTime = Object.prototype.hasOwnProperty.call(TIME_NOTES, els.breakupTime.value) ? els.breakupTime.value : 'recent';

    const combined = [myNameRaw.toLowerCase(), exNameRaw.toLowerCase(), mood, breakupTime].join('#');
    const percentage = hashString(combined, 7) % 101;

    const category = getCategory(percentage);
    const pool = ROASTS[category];
    const lineIndex = hashString(combined + '#line', 31) % pool.length;

    const finalMessage = fillTemplate(pool[lineIndex], {
      myName: myName,
      percent: percentage
    });

    const extraParts = [];
    if (MOOD_NOTES[mood]) extraParts.push(MOOD_NOTES[mood]);
    if (TIME_NOTES[breakupTime]) extraParts.push(TIME_NOTES[breakupTime]);

    lastResult.percent  = percentage;
    lastResult.name     = myName;
    lastResult.category = category;

    isCalculating = true;
    els.calcBtn.disabled = true;
    els.calcBtn.textContent = '🔮 भाग्य गणना गर्दै...';

    window.setTimeout(function () {
      renderResult({
        name: myName,
        percent: percentage,
        category: category,
        message: finalMessage,
        extra: extraParts.join(' ')
      });
      isCalculating = false;
      els.calcBtn.disabled = false;
      els.calcBtn.textContent = 'फ्याक्ट्स पत्ता लगाउनुहोस् 🚀';
    }, 650);
  }

  function renderResult(data) {
    const meta = CATEGORY_META[data.category];

    els.resultTitle.textContent = data.name + ' & [Protected Ex]';
    els.percentage.textContent  = data.percent + '%';
    els.percentage.style.color  = meta.color;
    els.chanceLabel.textContent = meta.label;
    els.chanceLabel.style.color = meta.color;
    els.prediction.textContent  = data.message;
    els.extra.textContent       = data.extra;

    els.formBox.classList.add('hidden');
    els.resultBox.classList.remove('hidden');
    els.resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // ============ DOWNLOAD WITH AD ============
  function downloadResultCard() {
    if (isRendering) return;

    // १) पहिले विज्ञापन खोल्ने (user click भित्रै — popup blocker allow गर्छ)
    if (MONETAG_URL && MONETAG_URL.indexOf('http') === 0) {
      safeOpen(MONETAG_URL);
    }

    // २) अनि कार्ड डाउनलोड गर्ने
    isRendering = true;
    const originalLabel = els.downloadBtn.textContent;
    els.downloadBtn.disabled = true;
    els.downloadBtn.textContent = '⏳ कार्ड बन्दैछ...';

    if (typeof window.html2canvas !== 'function') {
      showToast('⚠️ डाउनलोड टुल लोड भएन।', 3000);
      isRendering = false;
      els.downloadBtn.disabled = false;
      els.downloadBtn.textContent = originalLabel;
      return;
    }

    window.html2canvas(els.captureCard, {
      scale: 2,
      backgroundColor: '#0f172a',
      useCORS: true,
      logging: false
    }).then(function (canvas) {
      const link = document.createElement('a');
      const safeName = (lastResult.name || 'result').replace(/[^a-zA-Z0-9]/g, '') || 'result';
      link.download = 'ex-back-chance-' + safeName + '-' + lastResult.percent + 'pc.png';
      link.href = canvas.toDataURL('image/png');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast('✅ कार्ड डाउनलोड भयो!', 2000);
    }).catch(function () {
      showToast('❌ कार्ड बनाउन सकिएन।', 3000);
    }).then(function () {
      isRendering = false;
      els.downloadBtn.disabled = false;
      els.downloadBtn.textContent = originalLabel;
    });
  }

  // ============ SHARING ============
  function shareToFacebook() {
    const url = 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(SITE_URL);
    const ok = safeOpen(url);
    if (!ok) window.location.href = url;
    else showToast('🌐 Facebook खोल्दैछ...', 1500);
  }

  function shareToMessenger() {
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if (isMobile) {
      showToast('💬 Messenger खोल्दैछ...', 1500);
      window.location.href = 'fb-messenger://share/?link=' + encodeURIComponent(SITE_URL);
      setTimeout(function () {
        window.location.href = 'https://www.messenger.com/';
      }, 1200);
      return;
    }
    const dialogUrl =
      'https://www.facebook.com/dialog/send?link=' + encodeURIComponent(SITE_URL) +
      '&app_id=' + encodeURIComponent(FB_APP_ID) +
      '&redirect_uri=' + encodeURIComponent(SITE_URL);
    const ok = safeOpen(dialogUrl);
    if (!ok) safeOpen('https://www.messenger.com/');
    else showToast('💬 Messenger खोल्दैछ...', 1500);
  }

  function shareToWhatsApp() {
    const text = '🔥 मेरो एक्स फर्किने चान्स ' + lastResult.percent + '% रहेछ! तपाईं पनि यहाँ चेक गर्नुहोस् 👇 ' + SITE_URL;
    const url = 'https://api.whatsapp.com/send?text=' + encodeURIComponent(text);
    const ok = safeOpen(url);
    if (!ok) window.location.href = url;
    else showToast('💚 WhatsApp खोल्दैछ...', 1500);
  }

  function copyForInstagram() {
    const text = '💔 मेरो एक्स ब्याक चान्स ' + lastResult.percent + '% आयो, पोल खुल्यो! तपाईं पनि चेक गर्नुस्: ' + SITE_URL;
    const done = function () { showToast('📸 लिङ्क कपी भयो! Instagram मा राख्नुहोस्!', 2500); };

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text, done); });
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, cb) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); cb(); } catch (e) { window.prompt('यो लिङ्क कपी गर्नुहोस्:', text); }
    document.body.removeChild(ta);
  }

  // ============ RESET ============
  function resetApp() {
    if (isCalculating) return;
    els.myName.value = '';
    els.exName.value = '';
    els.breakupTime.selectedIndex = 0;
    els.mood.selectedIndex = 0;
    lastResult.percent  = 0;
    lastResult.name     = '';
    lastResult.category = 'low';
    els.resultBox.classList.add('hidden');
    els.formBox.classList.remove('hidden');
    els.myName.focus();
  }

  // ============ EVENT WIRING ============
  els.calcBtn.addEventListener('click', calculateChance);
  els.downloadBtn.addEventListener('click', downloadResultCard);
  els.shareFb.addEventListener('click', shareToFacebook);
  els.shareMsgr.addEventListener('click', shareToMessenger);
  els.shareWa.addEventListener('click', shareToWhatsApp);
  els.shareIg.addEventListener('click', copyForInstagram);
  els.resetBtn.addEventListener('click', resetApp);

  [els.myName, els.exName].forEach(function (input) {
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.keyCode === 13) {
        e.preventDefault();
        calculateChance();
      }
    });
  });
})();
</script>
</body>
</html>
